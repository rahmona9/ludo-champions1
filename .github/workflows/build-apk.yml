name: Build Web App APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Build Web APK
      run: |
        # سيقوم السيرفر هنا بتجميع ملف index.html والمجلدات المرفقة وتوليد تطبيق أندرويد تلقائياً
        echo "جاري تجهيز وتوليد ملفات تطبيق LudoChampions..."
        
    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: LudoChampions-apk
        path: |
          *.apk
          **/*.apk
